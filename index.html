<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Space &amp; Style — Project Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0f1f4d; --ink-2:#34446f; --muted:#6a7595;
  --line:#dde2ee; --line-2:#c6cee2; --bg:#edf0f6; --card:#fff;
  --blue:#1f4fbf; --blue-soft:#e6edfc; --orange:#f29a1f; --orange-d:#d9820a;
  --red:#b3261e; --red-soft:#fdeceb; --amber:#9a5a00; --amber-soft:#fff1dc;
  --green:#17784a; --green-soft:#e3f5ec;
  --font:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);font-size:14px;line-height:1.4;color:var(--ink);background:var(--bg);font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
[hidden]{display:none!important}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:60;background:var(--ink);color:#fff;display:flex;align-items:center;gap:14px;padding:8px 18px;border-bottom:3px solid var(--orange)}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.logo-chip{background:#fff;border-radius:6px;padding:3px 8px;display:flex;align-items:center}
.logo-chip img{height:28px;display:block}
.brand-t{font-weight:700;font-size:15px}
.projbtn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:6px;padding:6px 12px;display:flex;align-items:center;gap:8px;max-width:360px;min-width:0}
.projbtn #projName{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.projbtn:hover{background:rgba(255,255,255,.16)}
.tb-actions{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tb-btn{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.28);border-radius:6px;padding:6px 11px;font-weight:600;font-size:13px}
.tb-btn:hover:not(:disabled){background:rgba(255,255,255,.14)}
.tb-btn:disabled{opacity:.4;cursor:default}
.tb-btn.primary{background:var(--orange);border-color:var(--orange);color:#1c1200}
.tb-btn.primary:hover{background:var(--orange-d);border-color:var(--orange-d)}

.tabs{background:#fff;border-bottom:1px solid var(--line);padding:0 18px;display:flex;gap:24px;position:sticky;top:53px;z-index:50;overflow-x:auto}
.tab{padding:12px 2px 10px;font-weight:700;color:var(--muted);border:0;background:none;border-bottom:3px solid transparent;font-size:14px;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--ink);border-bottom-color:var(--orange)}
.tab .pip{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;line-height:17px;text-align:center;vertical-align:1px}

/* ---------- layout ---------- */
.wrap{max-width:1640px;margin:0 auto;padding:18px}
.split{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:16px;align-items:start}
.side{position:sticky;top:112px}
@media (max-width:1100px){.split{grid-template-columns:minmax(0,1fr)}.side{position:static}}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:14px}
.card>h2{margin:0 0 4px;font-size:15px;font-weight:800}
.card>.sub{margin:0 0 12px;color:var(--muted);font-size:12.5px}
.hint{color:var(--muted);font-size:12.5px;margin:8px 0 0}
.grid{display:grid;gap:10px 14px}
.g1{grid-template-columns:minmax(0,1fr)}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:820px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.fld{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);font-weight:600;min-width:0}
.fld>span:empty{display:none}
.fld.span2{grid-column:span 2}
.fld.chk{flex-direction:row;align-items:center;gap:8px;font-size:13px;color:var(--ink);font-weight:500;padding-top:18px}
input[type=text],input[type=date],select,textarea{width:100%;border:1px solid var(--line-2);border-radius:6px;padding:7px 9px;background:#fff;min-width:0;font-weight:500}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--blue)}
textarea{resize:vertical;line-height:1.4}
textarea.autosize{resize:none;overflow:hidden;line-height:1.25;padding:6px 7px;display:block}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue-soft);border-color:var(--blue)}
input.r{text-align:right}

.btn{border:1px solid var(--line-2);background:#fff;color:var(--ink);border-radius:6px;padding:7px 12px;font-weight:600;font-size:13px}
.btn:hover{background:var(--blue-soft);border-color:var(--blue)}
.btn.primary{background:var(--orange);border-color:var(--orange);color:#1c1200}
.btn.primary:hover{background:var(--orange-d);border-color:var(--orange-d)}
.btn.solid{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.solid:hover{background:var(--ink-2)}
.btn.danger{color:var(--red)}
.btn.danger:hover{background:var(--red-soft);border-color:var(--red)}
.btn.sm{padding:4px 9px;font-size:12px}
.ib{border:1px solid var(--line-2);background:#fff;color:var(--ink-2);border-radius:5px;min-width:26px;height:26px;padding:0 6px;font-size:12px;font-weight:700}
.ib:hover:not(:disabled){background:var(--blue-soft);border-color:var(--blue);color:var(--blue)}
.ib:disabled{opacity:.35;cursor:default}
.ib.del:hover:not(:disabled){background:var(--red-soft);border-color:var(--red);color:var(--red)}
.row-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
@media (max-width:900px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.stat .k{font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.2px}
.stat .v{font-size:23px;font-weight:800;letter-spacing:-.5px;margin-top:3px;line-height:1.15}
.stat .s{font-size:12px;color:var(--ink-2);margin-top:3px}
.stat.good .v{color:var(--green)} .stat.bad .v{color:var(--red)} .stat.warn .v{color:var(--amber)}

.bar{height:8px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:var(--blue);border-radius:5px}
.bar.g>i{background:var(--green)} .bar.a>i{background:var(--orange)} .bar.r>i{background:var(--red)}
.dual{position:relative;height:8px;border-radius:5px;background:var(--line);margin-top:8px}
.dual .act{position:absolute;inset:0 auto 0 0;background:var(--blue);border-radius:5px}
.dual .plan{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}

/* ---------- tables ---------- */
.tablewrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;min-width:820px}
table.t th{font-size:12px;color:var(--muted);font-weight:700;text-align:left;padding:6px 5px;border-bottom:2px solid var(--line-2);white-space:nowrap}
table.t th.r{text-align:right}
table.t td{padding:4px 3px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t td.r{text-align:right}
table.t td.idx{width:26px;color:var(--muted);text-align:center;font-size:12px}
table.t input,table.t select{padding:6px 7px}
table.t tr.sect td{background:#f3f5fb;font-weight:800;padding:7px 8px;color:var(--ink-2);border-bottom:1px solid var(--line-2)}
table.t tfoot td{border-top:2px solid var(--line-2);border-bottom:0;font-weight:800;padding-top:8px}
.calc{display:block;text-align:right;font-weight:700;white-space:nowrap;padding:6px 4px}
.calc.soft{font-weight:500;color:var(--ink-2)}
.empty{padding:26px;text-align:center;color:var(--muted)}
.acts{white-space:nowrap}
.acts .ib{margin-right:2px}

.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.pill.grey{background:var(--line);color:var(--ink-2)}
.pill.blue{background:var(--blue-soft);color:var(--blue)}
.pill.amber{background:var(--amber-soft);color:var(--amber)}
.pill.red{background:var(--red-soft);color:var(--red)}
.pill.green{background:var(--green-soft);color:var(--green)}
tr.late td{background:#fff7f6}
tr.soon td{background:#fffaf0}

.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line-2);background:#fff;border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:700;color:var(--ink-2)}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input[type=text]{width:260px}
.toolbar select{width:auto;min-width:150px}

/* ---------- look-ahead ---------- */
.week{border:1px solid var(--line);border-radius:8px;margin-bottom:10px;overflow:hidden}
.week>h3{margin:0;padding:8px 12px;background:#f3f5fb;font-size:13px;font-weight:800;display:flex;justify-content:space-between;align-items:center;gap:10px}
.week>h3 small{font-weight:600;color:var(--muted)}
.week.od>h3{background:var(--red-soft);color:var(--red)}
.week ul{list-style:none;margin:0;padding:0}
.week li{display:grid;grid-template-columns:110px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:7px 12px;border-top:1px solid var(--line)}
.week li b{font-weight:700}
.week li .d{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.week li .q{font-size:12.5px;color:var(--muted);white-space:nowrap}
@media (max-width:700px){.week li{grid-template-columns:minmax(0,1fr) auto}.week li .q{display:none}}

/* ---------- gantt ---------- */
.gantt{border:1px solid var(--line);border-radius:8px;overflow:auto;background:#fff}
.gantt table{border-collapse:collapse;width:100%}
.gantt th,.gantt td{border-right:1px solid var(--line);padding:0}
.gantt .nm{position:sticky;left:0;z-index:3;background:#fff;border-right:2px solid var(--line-2);min-width:230px;max-width:230px;padding:5px 10px;font-size:13px;text-align:left}
.gantt thead .nm{background:#f3f5fb;z-index:4}
.gantt thead th{background:#f3f5fb;font-size:11px;font-weight:700;color:var(--muted);padding:4px 2px;text-align:center;white-space:nowrap;border-bottom:1px solid var(--line-2)}
.gantt thead th.mo{text-align:left;padding-left:6px;font-size:11.5px;color:var(--ink-2);border-bottom:0}
.gantt tbody tr:nth-child(even) td{background:#fafbfe}
.gantt tbody tr:nth-child(even) .nm{background:#fafbfe}
.gantt .cell{height:30px;position:relative}
.gantt .cell.we{background:#f2f4f9}
.gantt tbody tr:nth-child(even) .cell.we{background:#eef1f7}
.gbar{position:absolute;top:6px;height:18px;border-radius:4px;background:var(--blue-soft);border:1px solid var(--blue);overflow:hidden}
.gbar>i{display:block;height:100%;background:var(--blue);opacity:.85}
.gbar.done{background:var(--green-soft);border-color:var(--green)}
.gbar.done>i{background:var(--green)}
.gbar.late{background:var(--red-soft);border-color:var(--red)}
.gbar.late>i{background:var(--red)}
.gbar span{position:absolute;left:5px;top:0;line-height:18px;font-size:11px;font-weight:700;color:var(--ink);white-space:nowrap}
.today{position:absolute;top:0;bottom:0;width:2px;background:var(--orange);z-index:2;pointer-events:none}
.ms{position:absolute;top:7px;width:14px;height:14px;background:var(--ink);transform:rotate(45deg);border-radius:2px}
.ms.done{background:var(--green)}
.gantt .msrow .nm{font-weight:700;color:var(--ink-2)}
.glegend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px;align-items:center}
.glegend i{display:inline-block;width:12px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* ---------- subcontractors ---------- */
.sublist{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.subchip{border:1px solid var(--line-2);border-top:3px solid var(--line-2);background:#f8f9fc;border-radius:8px 8px 0 0;padding:7px 14px 8px;min-width:180px;text-align:left;display:flex;flex-direction:column;gap:1px}
.subchip:hover{background:#fff}
.subchip.on{background:#fff;border-top-color:var(--orange)}
.subchip .t{font-weight:800;font-size:13.5px}
.subchip .s{font-size:11.5px;color:var(--muted)}
.subchip .n{font-size:13px;font-weight:700;color:var(--ink-2)}
.ledger .row{display:flex;justify-content:space-between;align-items:baseline;padding:7px 0;border-bottom:1px dashed var(--line-2);gap:8px}
.ledger .row span{color:var(--ink-2)}
.ledger .row b{font-weight:800}
.ledger .row.neg b{color:var(--red)}
.ledger .big{border-bottom:0;padding-top:12px;flex-direction:column;align-items:stretch}
.ledger .big span{font-weight:700}
.ledger .big b{font-size:26px;letter-spacing:-.6px;text-align:right}
.ledger .mini{font-size:12px;color:var(--muted);margin-top:8px}
.ledger .btn{width:100%;margin-top:10px}

/* ---------- modal + toast ---------- */
.modal-ov{position:fixed;inset:0;background:rgba(15,31,77,.5);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px 16px;overflow:auto}
.modal{background:#fff;border-radius:10px;width:min(620px,100%);box-shadow:0 24px 60px rgba(15,31,77,.35);padding:18px 20px 16px;max-height:88vh;overflow:auto}
.modal.wide{width:min(860px,100%)}
.modal h3{margin:0 0 4px;font-size:17px}
.modal .sub{margin:0 0 12px;color:var(--muted);font-size:13px}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap;position:sticky;bottom:-16px;background:#fff;padding:12px 0 2px;border-top:1px solid var(--line)}
.plist{border:1px solid var(--line);border-radius:8px;max-height:48vh;overflow:auto}
.plist .pr{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line)}
.plist .pr:last-child{border-bottom:0}
.plist .pr.cur{background:var(--blue-soft)}
.plist .pn{flex:1;min-width:0}
.plist .pn b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plist .pn small{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(16px);background:var(--ink);color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:400;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.help{background:#fff8ea;border:1px solid #f3d9a4;border-radius:8px;padding:9px 12px;font-size:13px;color:#6b4a06;margin-bottom:12px}
.help.red{background:var(--red-soft);border-color:#f0b4b0;color:#7a1c16}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}

/* ---------- printed report ---------- */
#reportRoot{position:absolute;left:-99999px;top:0;width:210mm;visibility:hidden}
body.report #appShell{display:none}
body.report{background:#4b525e}
body.report #reportRoot{position:static;left:auto;width:auto;visibility:visible;padding:70px 0 40px}
body.report #reportBar{display:flex}
#reportBar{display:none;align-items:center;gap:12px;position:fixed;top:0;left:0;right:0;z-index:150;background:var(--ink);color:#fff;padding:10px 18px;border-bottom:3px solid var(--orange)}
#reportBar .grow{flex:1}
.rpage{width:210mm;min-height:296mm;background:#fff;color:#000;padding:14mm 15mm;margin:0 auto 18px;box-shadow:0 6px 26px rgba(0,0,0,.45);font-family:Arial,Helvetica,sans-serif;font-size:10pt;line-height:1.3}
.rpage h1{font-size:17pt;margin:0 0 2mm}
.rpage h2{font-size:11.5pt;margin:6mm 0 2mm;padding-bottom:1mm;border-bottom:.4mm solid #0f1f4d;color:#0f1f4d}
.rpage .rhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10mm;border-bottom:.6mm solid #0f1f4d;padding-bottom:3mm}
.rpage .rhead img{height:12mm}
.rpage .meta{font-size:9pt;color:#333;text-align:right}
.rpage table{width:100%;border-collapse:collapse;font-size:9pt;margin-top:1mm}
.rpage th{background:#0f1f4d;color:#fff;text-align:left;padding:1.4mm 2mm;font-size:8.5pt}
.rpage th.r,.rpage td.r{text-align:right}
.rpage td{border-bottom:.2mm solid #bbb;padding:1.2mm 2mm}
.rpage tfoot td{border-top:.4mm solid #0f1f4d;font-weight:700}
.rpage .kv{display:grid;grid-template-columns:repeat(4,1fr);gap:3mm;margin-top:2mm}
.rpage .kv div{border:.2mm solid #999;border-radius:1.5mm;padding:2mm}
.rpage .kv .k{font-size:7.5pt;color:#555;font-weight:700}
.rpage .kv .v{font-size:12pt;font-weight:700}
.rpage .note{font-size:8.5pt;color:#444;margin-top:2mm}
@media print{
  html,body{background:#fff!important}
  #appShell,#reportBar,#toast,#modalRoot{display:none!important}
  #reportRoot{position:static!important;left:auto!important;width:auto!important;visibility:visible!important;padding:0!important}
  .rpage{box-shadow:none!important;margin:0!important;break-after:page;page-break-after:always}
  .rpage.last{break-after:auto!important;page-break-after:auto!important}
  @page{size:A4;margin:0}
}

</style>
</head>
<body>
<div id="appShell">
  <header class="topbar">
    <div class="brand"><span class="logo-chip"><img id="brandLogo" alt="Space &amp; Style"></span><span class="brand-t">Project Tracker</span></div>
    <button class="projbtn" data-action="projects" title="Switch or manage projects"><span id="projName">Project</span><span>&#9662;</span></button>
    <div class="tb-actions">
      <button class="tb-btn" id="btnUndo" data-action="undo" title="Undo (Ctrl+Z)" disabled>&#8630; Undo</button>
      <button class="tb-btn" id="btnRedo" data-action="redo" title="Redo (Ctrl+Y)" disabled>&#8631; Redo</button>
      <button class="tb-btn" data-action="import-quote" title="Start a project from a confirmed Quote Studio quote">Import quote</button>
      <button class="tb-btn" data-action="export-json">Export</button>
      <button class="tb-btn" data-action="settings">Settings</button>
      <button class="tb-btn primary" data-action="report">Project report</button>
    </div>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <main id="panel"></main>
</div>
<div id="reportBar"></div>
<div id="reportRoot"></div>
<div id="modalRoot"></div>

function num(v){
  if(typeof v === 'number') return isFinite(v) ? v : 0;
  const n = parseFloat(String(v == null ? '' : v).replace(/,/g,'').replace(/[^\d.\-]/g,''));
  return isFinite(n) ? n : 0;
}
const r2 = n => Math.round((n + Number.EPSILON) * 100) / 100;
const clampPct = n => Math.max(0, Math.min(100, num(n)));
function fmt(n, dp = 2){
  n = Number(n) || 0;
  const neg = n < 0, p = Math.abs(n).toFixed(dp).split('.');
  return (neg ? '-' : '') + p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',') + (p[1] ? '.' + p[1] : '');
}
const fmt0 = n => fmt(n, 0);
const numDisp = v => (v === 0 || v === '' || v == null || !isFinite(v)) ? '' : String(v);
const pad2 = n => String(n).padStart(2, '0');
const DAY = 86400000;
function todayISO(){ const d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function dParse(iso){ const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || ''); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; }
function dISO(d){ return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function addDays(iso, n){ const d = dParse(iso); if(!d) return ''; d.setDate(d.getDate() + n); return dISO(d); }
function daysBetween(a, b){ const x = dParse(a), y = dParse(b); return (x && y) ? Math.round((y - x) / DAY) : 0; }
function fmtDMY(iso){ const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || ''); return m ? m[3] + '/' + m[2] + '/' + m[1] : ''; }
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtDM(iso){ const d = dParse(iso); return d ? d.getDate() + ' ' + MONTHS[d.getMonth()] : ''; }
function mondayOf(iso){ const d = dParse(iso); if(!d) return ''; const k = (d.getDay() + 6) % 7; d.setDate(d.getDate() - k); return dISO(d); }
const splitLines = t => String(t || '').split(/\r?\n/).map(s => s.trim()).filter(Boolean);
const clone = o => JSON.parse(JSON.stringify(o));
function setPath(o, p, v){

}

/* ---------- import from Quote Studio ---------- */
function qsLineNet(l){ return num(l.excl) * (1 - num(l.disc) / 100); }
function qsQuoteSub(q){ return r2((q.lines || []).reduce((s, l) => s + r2(num(l.qty) * qsLineNet(l)), 0)); }
function qsGrandTotals(qp){
  const g = qp.grand || {};
  const items = g.items || [];
  const amount = it => {
    if(it.kind === 'quote'){
      if(it.override !== null && it.override !== undefined && it.override !== '') return r2(num(it.override));
      const q = (qp.quotes || []).find(x => x.id === it.quoteId);
      return q ? qsQuoteSub(q) : 0;
    }
    return r2(num(it.qty) * num(it.rate));
  };
  const sub = r2(items.reduce((s, it) => s + amount(it), 0));
  const vat = r2(sub * num(g.vatPct === undefined ? 16 : g.vatPct) / 100);
  return { sub, vat, total:r2(sub + vat) };
}
function looksLikeQuoteStudio(o){ return !!(o && Array.isArray(o.quotes) && o.grand); }
/* Quote lines become the material schedule: same codes, same quantities. */
function projectFromQuoteStudio(qp){
  const p = blankProject(qp.projectName || (qp.client && qp.client.name) || 'Imported project');
  p.client = (qp.client && qp.client.name) || '';
  p.location = qp.projectLocation || (qp.client && qp.client.location) || '';
  p.ref = (qp.client && qp.client.code) || '';
  p.roofArea = num(qp.grand && qp.grand.roofArea);
  p.notes = (qp.grand && qp.grand.scope) || '';
  const T = qsGrandTotals(qp);
  p.contractValue = T.total; p.vatIncluded = true;
  p.sourceQuote = { id:qp.id, sub:T.sub, vat:T.vat, total:T.total, at:Date.now() };
  const seen = {};
  (qp.quotes || []).forEach(q => (q.lines || []).forEach(l => {
    const qty = num(l.qty);
    if(qty <= 0) return;
    const desc = String(l.desc || '').trim();
    if(!desc && !String(l.code || '').trim()) return;
    if(/^transport charges?$/i.test(desc)) return;      /* a service, not a material */
    const key = (String(l.code || '').trim().toLowerCase() || desc.toLowerCase());
    if(seen[key]){ seen[key].qtyReq = r2(seen[key].qtyReq + qty); return; }   /* same code in two quotes */
    const m = newMaterial({ code:String(l.code || '').trim(), desc:desc || String(l.code || ''), qtyReq:qty, rate:r2(qsLineNet(l)), unit:'pcs' });
    seen[key] = m; p.materials.push(m);
  }));
  seedProgramme(p); seedTerms(p);
  return p;
}
function normalizeProject(p){
  const b = blankProject();
  Object.keys(b).forEach(k => { if(p[k] === undefined) p[k] = b[k]; });
  ['materials','activities','milestones','terms','subs'].forEach(k => { if(!Array.isArray(p[k])) p[k] = []; });
  p.materials = p.materials.map(m => newMaterial(m));
  p.activities = p.activities.map(a => newActivity(a));
  p.milestones = p.milestones.map(m => newMilestone(m));
  p.terms = p.terms.map(t => newTerm(t));
  p.subs = p.subs.map(s => {
    const sb = newSub(s);
    sb.variations = (s.variations || []).map(v => newVariation(v));
    sb.certs = (s.certs || []).map(c => newCert(c));
    sb.payments = (s.payments || []).map(x => newPayment(x));
    sb.issues = (s.issues || []).map(x => newIssue(x));
    return sb;
  });
  if(!p.id) p.id = uuid();
  return p;
}

/* ---- progress ---- */
function activityPlannedPct(a, on){
  const s = dParse(a.start), e = dParse(a.end), d = dParse(on || todayISO());
  if(!s || !e || !d) return 0;
  if(d < s) return 0;
  if(d >= e) return 100;
  const span = Math.max(1, (e - s) / DAY + 1);
  return clampPct(((d - s) / DAY + 1) / span * 100);
}
function progress(){
  const acts = project.activities;
  const wTot = acts.reduce((s, a) => s + Math.max(0, num(a.weight) || 1), 0);
  if(!wTot) return { actual:0, planned:0, variance:0 };
  const actual = acts.reduce((s, a) => s + clampPct(a.pct) * (num(a.weight) || 1), 0) / wTot;
  const planned = acts.reduce((s, a) => s + activityPlannedPct(a) * (num(a.weight) || 1), 0) / wTot;
  return { actual:r2(actual), planned:r2(planned), variance:r2(actual - planned) };
}
function programmeRange(){
  let min = project.startDate, max = project.endDate;
  project.activities.forEach(a => { if(a.start && (!min || a.start < min)) min = a.start; if(a.end && (!max || a.end > max)) max = a.end; });
  project.milestones.forEach(m => { if(m.date && (!min || m.date < min)) min = m.date; if(m.date && (!max || m.date > max)) max = m.date; });
  if(!min) min = todayISO(); if(!max) max = addDays(min, 30);
  return { start:min, end:max };
}

/* ---- procurement ---- */
function matState(m){
  const req = num(m.qtyReq), ord = num(m.qtyOrdered), del = num(m.qtyDelivered);
  if(req > 0 && del >= req) return 'delivered';
  if(del > 0) return 'part';
  if(ord > 0) return ord >= req ? 'ordered' : 'part-ordered';
  return 'to-order';
}
const matStateLabel = s => ({ 'to-order':'To order', 'part-ordered':'Part ordered', 'ordered':'Ordered', 'part':'Part delivered', 'delivered':'Delivered' })[s] || s;
const matOutstanding = m => Math.max(0, r2(num(m.qtyReq) - num(m.qtyDelivered)));
const matValue = m => r2(num(m.qtyReq) * num(m.rate));          /* value at the price quoted to the client */
const matCost  = m => r2(num(m.qtyReq) * num(m.cost));          /* what buying it actually costs us */
function matUrgency(m){
  const st = matState(m);
  if(st === 'delivered') return 'ok';
  if(!m.needBy) return 'none';
  const d = daysBetween(todayISO(), m.needBy);
  if(d < 0) return 'late';
  if(d <= 7) return 'soon';
  if(d <= 21) return 'watch';
  return 'none';
}
function procurementTotals(){
  const ms = project.materials;
  const value = r2(ms.reduce((s, m) => s + matValue(m), 0));
  const cost = r2(ms.reduce((s, m) => s + matCost(m), 0));
  const costed = ms.filter(m => num(m.cost) > 0).length;
  const deliveredValue = r2(ms.reduce((s, m) => s + r2(num(m.qtyDelivered) * num(m.rate)), 0));
  const counts = { total:ms.length, late:0, soon:0, toOrder:0, delivered:0 };
  ms.forEach(m => {
    const u = matUrgency(m), st = matState(m);
    if(u === 'late') counts.late++; else if(u === 'soon') counts.soon++;
    if(st === 'to-order') counts.toOrder++;
    if(st === 'delivered') counts.delivered++;
  });
  return { value, cost, costed, uncosted: ms.length - costed, deliveredValue, pct: value ? r2(deliveredValue / value * 100) : 0, counts };
}
/* Look-ahead: what still has to arrive, bucketed by the week it is needed */
function lookAhead(weeks){
  weeks = Math.max(1, num(weeks) || 4);
  const start = mondayOf(todayISO());
  const buckets = [];
  for(let i = 0; i < weeks; i++){
    const ws = addDays(start, i * 7);
    buckets.push({ start:ws, end:addDays(ws, 6), label:(i === 0 ? 'This week' : i === 1 ? 'Next week' : 'Week of ' + fmtDM(ws)), items:[] });
  }
  const overdue = { start:'', end:'', label:'Overdue', items:[] };
  const later = { start:'', end:'', label:'Later / no date', items:[] };
  project.materials.forEach(m => {
    if(matState(m) === 'delivered') return;
    if(!m.needBy){ later.items.push(m); return; }
    if(m.needBy < start){ overdue.items.push(m); return; }
    const b = buckets.find(x => m.needBy >= x.start && m.needBy <= x.end);
    (b || later).items.push(m);
  });
  return [overdue].concat(buckets).concat([later]).filter(b => b.items.length);
}

/* ---- client payments ---- */
const termAmount = t => (t.amount !== null && t.amount !== undefined && t.amount !== '') ? r2(num(t.amount)) : r2(num(project.contractValue) * num(t.pct) / 100);
function termState(t){
  const due = termAmount(t), rec = num(t.received), inv = num(t.invoiced);
  if(due > 0 && rec >= due - 0.005) return 'paid';
  if(rec > 0) return 'part';
  if(inv > 0) return 'invoiced';
  return 'pending';
}
const termStateLabel = s => ({ pending:'Not invoiced', invoiced:'Invoiced', part:'Part paid', paid:'Paid' })[s] || s;
function paymentTotals(){
  const ts = project.terms;
  const due = r2(ts.reduce((s, t) => s + termAmount(t), 0));
  const invoiced = r2(ts.reduce((s, t) => s + num(t.invoiced), 0));
  const received = r2(ts.reduce((s, t) => s + num(t.received), 0));
  const contract = r2(num(project.contractValue));
  return { due, invoiced, received,
    outstanding: r2(invoiced - received),
    unbilled: r2(contract - invoiced),
    pctReceived: contract ? r2(received / contract * 100) : 0,
    pctInvoiced: contract ? r2(invoiced / contract * 100) : 0,
    unallocated: r2(contract - due) };
}
/* Is the money keeping up with the work? */
function cashVsWork(){
  const pr = progress(), pt = paymentTotals();
  const earned = r2(num(project.contractValue) * pr.actual / 100);
  return { workPct:pr.actual, cashPct:pt.pctReceived, earned, received:pt.received, gap:r2(earned - pt.received) };
}

/* ---- subcontractors ---- */
function subAccount(s){
  const variations = r2((s.variations || []).filter(v => v.approved).reduce((a, v) => a + num(v.amount), 0));
  const pending = r2((s.variations || []).filter(v => !v.approved).reduce((a, v) => a + num(v.amount), 0));
  const revised = r2(num(s.contractSum) + variations);
  const certs = (s.certs || []).slice().sort((a, b) => String(a.date).localeCompare(String(b.date)));
  const gross = r2(certs.reduce((m, c) => Math.max(m, num(c.grossToDate)), 0));   /* certificates are cumulative */
  const retention = r2(gross * num(s.retentionPct) / 100);
  const issues = r2((s.issues || []).filter(i => i.recover).reduce((a, i) => a + num(i.value), 0));
  const issuesFree = r2((s.issues || []).filter(i => !i.recover).reduce((a, i) => a + num(i.value), 0));
  const paid = r2((s.payments || []).reduce((a, p) => a + num(p.amount), 0));
  const netCertified = r2(gross - retention);
  const balance = r2(netCertified - issues - paid);
  return { variations, pending, revised, gross, retention, netCertified, issues, issuesFree, paid, balance,
    pctCertified: revised ? r2(gross / revised * 100) : 0,
    remaining: r2(revised - gross) };
}
function subsTotals(){
  const a = project.subs.map(subAccount);
  return {
    count: project.subs.length,
    revised: r2(a.reduce((s, x) => s + x.revised, 0)),
    gross: r2(a.reduce((s, x) => s + x.gross, 0)),
    retention: r2(a.reduce((s, x) => s + x.retention, 0)),
    paid: r2(a.reduce((s, x) => s + x.paid, 0)),
    balance: r2(a.reduce((s, x) => s + x.balance, 0)),
    issues: r2(a.reduce((s, x) => s + x.issues, 0))
  };
}
/* headline margin: what is left of the contract after subbies and materials */
/* Margin uses what materials COST us, not the price they were quoted at.
   Lines with no buy price are counted so the figure is never silently wrong. */
function projectMargin(){
  const contract = r2(num(project.contractValue));
  const ex = project.vatIncluded ? r2(contract / (1 + num(settings.vatPct) / 100)) : contract;
  const subs = subsTotals().revised;
  const pc = procurementTotals();
  const margin = r2(ex - subs - pc.cost);
  return { contract, ex, subs, mats:pc.cost, sell:pc.value, uncosted:pc.uncosted, total:pc.counts.total,
    cost:r2(subs + pc.cost), margin, pct: ex ? r2(margin / ex * 100) : 0 };
}

const TABS = [['dashboard','Dashboard'],['procure','Procurement'],['programme','Programme'],['subs','Subcontractors'],['payments','Payments'],['buying','All projects']];
const CUR = () => settings.currency || 'KSh';

function A(o){ return Object.keys(o).filter(k => o[k] !== undefined && o[k] !== null).map(k => 'data-' + k + '="' + esc(o[k]) + '"').join(' '); }
function inp(o, val, cls, ph, extra){
  return '<input type="text" autocomplete="off" spellcheck="false"' + (o.num ? ' inputmode="decimal"' : '') + ' class="' + (cls || '') + '" ' + A(o) + ' value="' + esc(val == null ? '' : val) + '" placeholder="' + esc(ph || '') + '" ' + (extra || '') + '>';
}
function dat(o, val){ return '<input type="date" autocomplete="off" ' + A(o) + ' value="' + esc(val || '') + '">'; }
function taInp(o, val, ph){ return '<textarea rows="1" class="autosize" autocomplete="off" ' + A(o) + ' placeholder="' + esc(ph || '') + '">' + esc(val == null ? '' : val) + '</textarea>'; }
function autosize(el){ el.style.height = 'auto'; el.style.height = (el.scrollHeight + (el.offsetHeight - el.clientHeight)) + 'px'; }
function autosizeAll(){ $$('textarea.autosize').forEach(autosize); }
function F(label, o, val, opts){
  opts = opts || {};
  const f = opts.type === 'date' ? dat(o, val) : inp(o, val, opts.cls || '', opts.ph || '', opts.extra || '');
  return '<label class="fld ' + (opts.span || '') + '"><span>' + esc(label) + '</span>' + f + '</label>';
}
function CHK(label, o, val, span){ return '<label class="fld chk ' + (span || '') + '"><input type="checkbox" ' + A(o) + (val ? ' checked' : '') + '><span>' + esc(label) + '</span></label>'; }
function TA(label, o, val, rows, ph, span){ return '<label class="fld ' + (span || '') + '"><span>' + esc(label) + '</span><textarea rows="' + (rows || 3) + '" autocomplete="off" ' + A(o) + ' placeholder="' + esc(ph || '') + '">' + esc(val) + '</textarea></label>'; }
function SEL(o, options, cur, extra){
  return '<select ' + A(o) + ' ' + (extra || '') + '>' + options.map(x => {
    const v = Array.isArray(x) ? x[0] : x, l = Array.isArray(x) ? x[1] : x;
    return '<option value="' + esc(v) + '"' + (String(v) === String(cur) ? ' selected' : '') + '>' + esc(l) + '</option>';
  }).join('') + '</select>';
}
const stat = (k, v, s, cls) => '<div class="stat ' + (cls || '') + '"><div class="k">' + k + '</div><div class="v">' + v + '</div>' + (s ? '<div class="s">' + s + '</div>' : '') + '</div>';

/* ---------- chrome ---------- */
function renderTopbar(){
  const n = $('#projName'); if(n) n.textContent = projectLabel(project);
  document.title = projectLabel(project) + ' — Project Tracker';
  updateHistBtns();
}
function renderTabs(){
  const la = project.materials.filter(m => matUrgency(m) === 'late').length;
  $('#tabs').innerHTML = TABS.map(t => {
    const pip = (t[0] === 'procure' && la) ? '<span class="pip">' + la + '</span>' : '';
    return '<button class="tab ' + (ui.tab === t[0] ? 'active' : '') + '" data-action="tab" data-tab="' + t[0] + '">' + t[1] + pip + '</button>';
  }).join('');
}
function render(){
  renderTopbar(); renderTabs();
  const fn = { dashboard:tabDashboard, procure:tabProcure, programme:tabProgramme, subs:tabSubs, payments:tabPayments, buying:tabBuying }[ui.tab];
  $('#panel').innerHTML = fn();
  refreshComputed(); autosizeAll(); renderModal();
  if(ui.focus){ const el = $(ui.focus.sel); if(el){ el.focus(); if(ui.focus.select && el.select) el.select(); } ui.focus = null; }
}

/* ---------- live figures ---------- */
function calcVal(el){
  const d = el.dataset;
  switch(d.calc){
    case 'matOut':   { const m = project.materials.find(x => x.id === d.i); return m ? (matOutstanding(m) ? fmt(matOutstanding(m), 2) : '—') : ''; }
    case 'matVal':   { const m = project.materials.find(x => x.id === d.i); return m ? fmt(matValue(m)) : ''; }
    case 'matState': { const m = project.materials.find(x => x.id === d.i); return m ? matStateLabel(matState(m)) : ''; }
    case 'matTotal': return fmt(procurementTotals().value);
    case 'matCost':  { const m = project.materials.find(x => x.id === d.i); return m ? (num(m.cost) ? fmt(matCost(m)) : '\u2014') : ''; }
    case 'matCostTot': return fmt(procurementTotals().cost);
    case 'termAmt':  { const t = project.terms.find(x => x.id === d.i); return t ? fmt(termAmount(t)) : ''; }
    case 'termBal':  { const t = project.terms.find(x => x.id === d.i); return t ? fmt(r2(termAmount(t) - num(t.received))) : ''; }
    case 'payDue':   return fmt(paymentTotals().due);
    case 'payInv':   return fmt(paymentTotals().invoiced);
    case 'payRec':   return fmt(paymentTotals().received);
    case 'payOut':   return fmt(paymentTotals().outstanding);
    case 'subRev':   { const s = project.subs.find(x => x.id === d.i); return s ? fmt(subAccount(s).revised) : ''; }
    case 'subBal':   { const s = project.subs.find(x => x.id === d.i); return s ? fmt(subAccount(s).balance) : ''; }
    case 'varTot':   { const s = curSub(); return s ? fmt(subAccount(s).variations) : ''; }
    case 'certNet':  { const s = curSub(); return s ? fmt(subAccount(s).netCertified) : ''; }
    case 'payTot':   { const s = curSub(); return s ? fmt(subAccount(s).paid) : ''; }
    case 'issTot':   { const s = curSub(); return s ? fmt(subAccount(s).issues) : ''; }
    case 'actPct':   return fmt(progress().actual, 1) + '%';
  }
  return '';
}
function refreshComputed(){ $$('[data-calc]').forEach(el => { const v = calcVal(el); if(el.textContent !== v) el.textContent = v; }); }

/* ---------- Dashboard ---------- */
function tabDashboard(){
  const P = { s:'proj' };
  const pr = progress(), pt = paymentTotals(), pc = procurementTotals(), st = subsTotals(), mg = projectMargin(), cw = cashVsWork();
  const daysLeft = daysBetween(todayISO(), project.endDate);
  const late = pc.counts.late;
  const alerts = [];
  if(late) alerts.push(late + ' material line' + (late === 1 ? '' : 's') + ' already past the date they were needed on site.');
  if(pr.variance < -10) alerts.push('Work is ' + fmt(Math.abs(pr.variance), 1) + '% behind where the programme says it should be.');
  if(cw.gap > 0 && num(project.contractValue)) alerts.push('You have built ' + fmt(cw.earned) + ' but received ' + fmt(cw.received) + ' — ' + fmt(cw.gap) + ' of work is unpaid.');
  if(st.balance > 0) alerts.push(fmt(st.balance) + ' is certified and due to subcontractors.');
  if(daysLeft < 0 && pr.actual < 100) alerts.push('The completion date passed ' + Math.abs(daysLeft) + ' days ago and the job is at ' + fmt(pr.actual, 1) + '%.');

  return '<div class="wrap">' +
    '<div class="stats">' +
      stat('Progress', fmt(pr.actual, 1) + '%', 'Programme says ' + fmt(pr.planned, 1) + '%' + (pr.variance < 0 ? ' — behind' : pr.variance > 0 ? ' — ahead' : ''), pr.variance < -5 ? 'bad' : pr.variance > 0 ? 'good' : '') +
      stat('Received from client', CUR() + ' ' + fmt0(pt.received), fmt(pt.pctReceived, 1) + '% of the contract', pt.received > 0 ? '' : 'warn') +
      stat('Due to subcontractors', CUR() + ' ' + fmt0(st.balance), 'Retention held ' + fmt0(st.retention), st.balance > 0 ? 'warn' : 'good') +
      stat('Materials delivered', fmt(pc.pct, 0) + '%', pc.counts.delivered + ' of ' + pc.counts.total + ' lines' + (late ? ' · ' + late + ' late' : ''), late ? 'bad' : '') +
    '</div>' +
    (alerts.length ? '<div class="help' + (late || pr.variance < -10 ? ' red' : '') + '"><b>Needs attention</b><ul style="margin:6px 0 0;padding-left:18px">' + alerts.map(a => '<li>' + esc(a) + '</li>').join('') + '</ul></div>' : '') +
    '<div class="split"><div>' +
      '<section class="card"><h2>Project</h2><p class="sub">Contract value drives the payment terms and the margin below.</p><div class="grid g3">' +
        F('Project name', Object.assign({ f:'name' }, P), project.name, { span:'span2' }) +
        F('Client', Object.assign({ f:'client' }, P), project.client) +
        F('Location', Object.assign({ f:'location' }, P), project.location) +
        F('Our reference', Object.assign({ f:'ref' }, P), project.ref) +
        '<label class="fld"><span>Status</span>' + SEL(Object.assign({ f:'status', rr:1 }, P), [['confirmed','Confirmed — not started'],['running','On site'],['snagging','Snagging'],['complete','Complete'],['hold','On hold']], project.status) + '</label>' +
        F('Contract value (' + CUR() + ')', Object.assign({ f:'contractValue', num:1 }, P), numDisp(project.contractValue), { cls:'r' }) +
        F('Roof area (sqm)', Object.assign({ f:'roofArea', num:1 }, P), numDisp(project.roofArea), { cls:'r' }) +
        CHK('Contract value includes VAT', Object.assign({ f:'vatIncluded' }, P), project.vatIncluded) +
        F('Start on site', Object.assign({ f:'startDate' }, P), project.startDate, { type:'date' }) +
        F('Completion', Object.assign({ f:'endDate' }, P), project.endDate, { type:'date' }) +
      '</div></section>' +
      '<section class="card"><h2>Where the money goes</h2><p class="sub">A rough margin: the contract less what the subcontractors are owed and what the materials cost.</p>' +
        '<div class="tablewrap"><table class="t" style="min-width:420px"><tbody>' +
        '<tr><td>Contract value' + (project.vatIncluded ? ' (excl. VAT at ' + num(settings.vatPct) + '%)' : '') + '</td><td class="r"><b>' + fmt(mg.ex) + '</b></td></tr>' +
        '<tr><td>Subcontractors (contract sums + approved variations)</td><td class="r">' + fmt(mg.subs) + '</td></tr>' +
        '<tr><td>Materials at buy price' + (mg.uncosted ? ' <span class="pill amber">' + mg.uncosted + ' of ' + mg.total + ' lines not priced</span>' : '') + '</td><td class="r">' + fmt(mg.mats) + '</td></tr>' +
        '</tbody><tfoot><tr><td>Left for overheads and margin</td><td class="r" style="color:' + (mg.margin < 0 ? 'var(--red)' : 'var(--green)') + '">' + fmt(mg.margin) + ' &nbsp;(' + fmt(mg.pct, 1) + '%)</td></tr></tfoot></table></div>' +
        (mg.uncosted ? '<div class="help">This margin flatters you until every material line has a buy price. Fill in the <b>Buy price</b> column on the Procurement tab \u2014 the same schedule sells for ' + fmt(mg.sell) + '.</div>' : '') +
        '<p class="hint">Labour you carry yourself, transport and site overheads are not in this — treat it as a ceiling, not a profit.</p></section>' +
      '<section class="card"><h2>Notes</h2>' + TA('', { s:'proj', f:'notes' }, project.notes, 4, 'Scope, site constraints, anything the team should know.') + '</section>' +
    '</div><aside class="side">' +
      '<section class="card ledger"><h2>Progress</h2>' +
        '<div class="row"><span>Actual</span><b data-calc="actPct"></b></div>' +
        '<div class="dual"><span class="act" style="width:' + pr.actual + '%"></span><span class="plan" style="left:' + pr.planned + '%" title="programme"></span></div>' +
        '<div class="mini">The marker is where the programme says you should be (' + fmt(pr.planned, 1) + '%).</div>' +
        '<div class="row" style="margin-top:10px"><span>Days to completion</span><b>' + (daysLeft >= 0 ? daysLeft : 'overdue ' + Math.abs(daysLeft)) + '</b></div>' +
        '<div class="row"><span>Invoiced</span><b>' + fmt(pt.invoiced) + '</b></div>' +
        '<div class="row"><span>Outstanding invoices</span><b>' + fmt(pt.outstanding) + '</b></div>' +
        '<button class="btn primary" data-action="report">Project report</button>' +
      '</section></aside></div></div>';
}

/* ---------- Procurement ---------- */
function tabProcure(){
  const pc = procurementTotals();
  const toks = ui.matFilter.trim().toLowerCase().split(/\s+/).filter(Boolean);
  let list = project.materials;
  if(ui.matStatus) list = list.filter(m => matState(m).indexOf(ui.matStatus) === 0);
  if(toks.length) list = list.filter(m => { const h = (m.code + ' ' + m.desc + ' ' + m.supplier).toLowerCase(); return toks.every(t => h.includes(t)); });
  const rows = list.length ? list.map(m => matRow(m)).join('')
    : '<tr><td colspan="11" class="empty">' + (project.materials.length ? 'No materials match that filter.' : 'No materials yet — import a confirmed quote, or add a line.') + '</td></tr>';
  const la = lookAhead(settings.lookAheadWeeks);
  const laHtml = la.length ? la.map(b => '<div class="week ' + (b.label === 'Overdue' ? 'od' : '') + '"><h3>' + esc(b.label) + '<small>' + b.items.length + ' line' + (b.items.length === 1 ? '' : 's') + '</small></h3><ul>' +
      b.items.map(m => '<li><b>' + esc(m.code || '—') + '</b><span class="d">' + esc(m.desc) + '</span><span class="q">' + fmt(matOutstanding(m), 2) + ' ' + esc(m.unit) + ' short</span>' +
      '<span class="pill ' + pillFor(matState(m)) + '">' + matStateLabel(matState(m)) + '</span></li>').join('') + '</ul></div>').join('')
    : '<div class="empty">Nothing outstanding — every material line is delivered.</div>';

  return '<div class="wrap">' +
    '<div class="stats">' +
      stat('Schedule value', CUR() + ' ' + fmt0(pc.value), 'costs ' + fmt0(pc.cost) + ' to buy' + (pc.uncosted ? ' \u00b7 ' + pc.uncosted + ' not priced' : '')) +
      stat('Delivered', fmt(pc.pct, 0) + '%', CUR() + ' ' + fmt0(pc.deliveredValue) + ' on site') +
      stat('Still to order', String(pc.counts.toOrder), 'lines not ordered at all', pc.counts.toOrder ? 'warn' : 'good') +
      stat('Late', String(pc.counts.late), 'past the need-by date', pc.counts.late ? 'bad' : 'good') +
    '</div>' +
    '<section class="card"><h2>Look-ahead — next ' + num(settings.lookAheadWeeks) + ' weeks</h2>' +
      '<p class="sub">Everything not yet delivered, grouped by the week it is needed on site. Order the top group first.</p>' + laHtml + '</section>' +
    '<section class="card"><h2>Material schedule</h2><p class="sub">Quantities come across from the confirmed quote. Fill in the supplier, the date it is needed and what has actually been ordered and delivered.</p>' +
      '<div class="toolbar"><input type="text" id="matQ" autocomplete="off" placeholder="Filter by code, description or supplier…" value="' + esc(ui.matFilter) + '">' +
      SEL({ onchange:'matstatus' }, [['','All statuses']].concat(MAT_STATES), ui.matStatus) +
      '<button class="btn primary" data-action="mat-add">+ Add material</button>' +
      '<button class="btn" data-action="mat-import">Import from a quote…</button>' +
      '<button class="btn" data-action="mat-csv">Export CSV</button></div>' +
      '<div class="tablewrap"><table class="t" style="min-width:1340px"><colgroup><col style="width:26px"><col style="width:110px"><col><col style="width:58px"><col style="width:80px"><col style="width:80px"><col style="width:80px"><col style="width:70px"><col style="width:94px"><col style="width:98px"><col style="width:140px"><col style="width:132px"><col style="width:118px"></colgroup>' +
      '<thead><tr><th></th><th>Code</th><th>Description</th><th>Unit</th><th class="r">Required</th><th class="r">Ordered</th><th class="r">Delivered</th><th class="r">Short</th><th class="r">Buy price</th><th class="r">Cost</th><th>Supplier</th><th>Needed on site</th><th></th></tr></thead><tbody>' + rows + '</tbody>' +
      '<tfoot><tr><td colspan="8" class="r">Quoted value <span data-calc="matTotal"></span></td><td colspan="2" class="r">Cost <span data-calc="matCostTot"></span></td><td colspan="3"></td></tr></tfoot></table></div></section></div>';
}
const pillFor = st => ({ 'to-order':'grey', 'part-ordered':'amber', 'ordered':'blue', 'part':'amber', 'delivered':'green' })[st] || 'grey';
function matRow(m, i){
  const M = { s:'mat', i:m.id };
  const u = matUrgency(m), st = matState(m);
  return '<tr class="' + (u === 'late' ? 'late' : u === 'soon' ? 'soon' : '') + '"><td class="idx">' + (u === 'late' ? '!' : '') + '</td>' +
    '<td>' + inp(Object.assign({ f:'code' }, M), m.code, '', 'Code') + '</td>' +
    '<td>' + taInp(Object.assign({ f:'desc' }, M), m.desc, 'Description') + '</td>' +
    '<td>' + inp(Object.assign({ f:'unit' }, M), m.unit, '', 'pcs') + '</td>' +
    '<td>' + inp(Object.assign({ f:'qtyReq', num:1 }, M), numDisp(m.qtyReq), 'r', '0') + '</td>' +
    '<td>' + inp(Object.assign({ f:'qtyOrdered', num:1 }, M), numDisp(m.qtyOrdered), 'r', '0') + '</td>' +
    '<td>' + inp(Object.assign({ f:'qtyDelivered', num:1 }, M), numDisp(m.qtyDelivered), 'r', '0') + '</td>' +
    '<td class="r"><span class="calc soft" data-calc="matOut" data-i="' + m.id + '"></span></td>' +
    '<td>' + inp(Object.assign({ f:'cost', num:1 }, M), numDisp(m.cost), 'r', '0.00') + '</td>' +
    '<td class="r"><span class="calc soft" data-calc="matCost" data-i="' + m.id + '"></span></td>' +
    '<td>' + inp(Object.assign({ f:'supplier' }, M), m.supplier, '', 'Supplier') + '</td>' +
    '<td>' + dat(Object.assign({ f:'needBy' }, M), m.needBy) + '</td>' +
    '<td class="acts"><span class="pill ' + pillFor(st) + '">' + matStateLabel(st) + '</span> ' +
    '<button class="ib" data-action="mat-done" data-i="' + m.id + '" title="Mark the full quantity ordered and delivered">✓</button>' +
    '<button class="ib del" data-action="mat-del" data-i="' + m.id + '" title="Remove line">✕</button></td></tr>';
}

/* ---------- Subcontractors ---------- */
const curSub = () => project.subs.find(s => s.id === ui.subSel) || project.subs[0] || null;
function tabSubs(){
  const st = subsTotals();
  const chips = project.subs.map(s => {
    const a = subAccount(s);
    return '<button class="subchip ' + (curSub() && s.id === curSub().id ? 'on' : '') + '" data-action="sub-pick" data-i="' + s.id + '">' +
      '<span class="t">' + esc(s.name || 'Unnamed') + '</span><span class="s">' + esc(s.trade) + '</span>' +
      '<span class="n">' + (a.balance < 0 ? CUR() + ' ' + fmt0(-a.balance) + ' in advance' : CUR() + ' ' + fmt0(a.balance) + ' due') + '</span></button>';
  }).join('');
  const s = curSub();
  const head = '<div class="stats">' +
    stat('Subcontractors', String(st.count), '') +
    stat('Committed', CUR() + ' ' + fmt0(st.revised), 'contract sums + variations') +
    stat('Certified', CUR() + ' ' + fmt0(st.gross), 'retention held ' + fmt0(st.retention)) +
    stat('Due now', CUR() + ' ' + fmt0(st.balance), st.balance < 0 ? 'net paid ahead of certification' : 'certified, less paid', st.balance > 0 ? 'warn' : 'good') +
  '</div>';
  if(!s) return '<div class="wrap">' + head + '<section class="card"><div class="empty">No subcontractors yet.</div><div class="row-actions"><button class="btn primary" data-action="sub-add">+ Add subcontractor</button></div></section></div>';
  const a = subAccount(s), S = { s:'sub', i:s.id };
  return '<div class="wrap">' + head +
    '<div class="sublist">' + chips + '<button class="btn" data-action="sub-add">+ Add subcontractor</button></div>' +
    '<div class="split"><div>' +
    '<section class="card"><h2>' + esc(s.name || 'Subcontractor') + '</h2><div class="grid g4">' +
      F('Name', Object.assign({ f:'name' }, S), s.name, { span:'span2' }) +
      '<label class="fld"><span>Trade</span>' + SEL(Object.assign({ f:'trade', rr:1 }, S), TRADES, s.trade) + '</label>' +
      F('Contact', Object.assign({ f:'contact' }, S), s.contact) +
      F('Contract sum (' + CUR() + ')', Object.assign({ f:'contractSum', num:1 }, S), numDisp(s.contractSum), { cls:'r' }) +
      F('Retention %', Object.assign({ f:'retentionPct', num:1 }, S), numDisp(s.retentionPct), { cls:'r' }) +
    '</div></section>' +
    subVariations(s) + subCerts(s) + subPayments(s) + subIssues(s) +
    '</div><aside class="side"><section class="card ledger"><h2>Account</h2>' +
      '<div class="row"><span>Contract sum</span><b>' + fmt(s.contractSum) + '</b></div>' +
      '<div class="row"><span>Approved variations</span><b>' + fmt(a.variations) + '</b></div>' +
      '<div class="row"><span>Revised sum</span><b>' + fmt(a.revised) + '</b></div>' +
      '<div class="row"><span>Work certified</span><b>' + fmt(a.gross) + ' <small style="font-weight:600;color:var(--muted)">(' + fmt(a.pctCertified, 0) + '%)</small></b></div>' +
      '<div class="row"><span>Less retention ' + fmt(num(s.retentionPct), 0) + '%</span><b>-' + fmt(a.retention) + '</b></div>' +
      '<div class="row"><span>Less materials issued</span><b>-' + fmt(a.issues) + '</b></div>' +
      '<div class="row"><span>Less paid</span><b>-' + fmt(a.paid) + '</b></div>' +
      '<div class="row big ' + (a.balance < 0 ? 'neg' : '') + '"><span>' + (a.balance < 0 ? 'Paid ahead of work done' : 'Balance due') + '</span><b>' + fmt(Math.abs(a.balance)) + '</b></div>' +
      '<div class="mini">' + (a.pending ? fmt(a.pending) + ' of variations are still unapproved and are not counted.' : 'Retention is released outside this tool when the defects period ends.') + '</div>' +
      '<button class="btn danger" data-action="sub-del" data-i="' + s.id + '">Remove this subcontractor</button>' +
    '</section></aside></div></div>';
}
function subVariations(s){
  const rows = s.variations.length ? s.variations.map(v => {
    const V = { s:'var', i:s.id, j:v.id };
    return '<tr><td>' + dat(Object.assign({ f:'date' }, V), v.date) + '</td>' +
      '<td>' + taInp(Object.assign({ f:'desc' }, V), v.desc, 'What changed') + '</td>' +
      '<td>' + inp(Object.assign({ f:'amount', num:1 }, V), numDisp(v.amount), 'r', '0.00') + '</td>' +
      '<td style="text-align:center">' + '<input type="checkbox" ' + A(Object.assign({ f:'approved' }, V)) + (v.approved ? ' checked' : '') + '></td>' +
      '<td class="acts"><button class="ib del" data-action="var-del" data-i="' + s.id + '" data-j="' + v.id + '">✕</button></td></tr>';
  }).join('') : '<tr><td colspan="5" class="empty">No variations.</td></tr>';
  return '<section class="card"><h2>Variations</h2><p class="sub">Only ticked (approved) variations are added to the contract sum.</p>' +
    '<div class="tablewrap"><table class="t" style="min-width:600px"><colgroup><col style="width:140px"><col><col style="width:130px"><col style="width:90px"><col style="width:60px"></colgroup>' +
    '<thead><tr><th>Date</th><th>Description</th><th class="r">Amount</th><th style="text-align:center">Approved</th><th></th></tr></thead><tbody>' + rows + '</tbody>' +
    '<tfoot><tr><td colspan="2">Approved total</td><td class="r"><span data-calc="varTot"></span></td><td colspan="2"></td></tr></tfoot></table></div>' +
    '<div class="row-actions"><button class="btn" data-action="var-add" data-i="' + s.id + '">+ Add variation</button></div></section>';
}
function subCerts(s){
  const sorted = s.certs.slice().sort((a, b) => String(a.date).localeCompare(String(b.date)));
  const rows = sorted.length ? sorted.map((c, i) => {
    const C = { s:'cert', i:s.id, j:c.id };
    const prev = i > 0 ? num(sorted[i - 1].grossToDate) : 0;

/* ---------- the chart ---------- */
function ganttCols(){
  const r = programmeRange();
  const start = mondayOf(r.start);
  let end = r.end;
  const total = Math.max(7, daysBetween(start, end) + 1);
  const pad = ui.ganttZoom === 'month' ? 14 : 7;
  end = addDays(start, total + pad - 1);
  const days = daysBetween(start, end) + 1;
  const px = ui.ganttZoom === 'day' ? 26 : ui.ganttZoom === 'week' ? 11 : 4.2;
  return { start, end, days, px, width: Math.round(days * px) };
}
function ganttHTML(){
  if(!project.activities.length && !project.milestones.length) return '<div class="empty">Add an activity to see the programme.</div>';
  const C = ganttCols();
  const today = todayISO();
  /* top header: months, then day or week ticks */
  let months = '', ticks = '';
  let i = 0;
  while(i < C.days){
    const d = dParse(addDays(C.start, i));
    const daysInMonth = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
    const span = Math.min(C.days - i, daysInMonth - d.getDate() + 1);
    months += '<th class="mo" colspan="' + span + '">' + MONTHS[d.getMonth()] + ' ' + d.getFullYear() + '</th>';
    i += span;
  }
  const step = ui.ganttZoom === 'day' ? 1 : 7;
  for(let k = 0; k < C.days; k += step){
    const iso = addDays(C.start, k);
    const span = Math.min(step, C.days - k);
    ticks += '<th colspan="' + span + '">' + (ui.ganttZoom === 'month' ? fmtDM(iso).split(' ')[0] : fmtDM(iso)) + '</th>';
  }
  const cells = n => { let h = ''; for(let k = 0; k < n; k++){ const dd = dParse(addDays(C.start, k)).getDay(); h += '<td class="cell ' + (dd === 0 || dd === 6 ? 'we' : '') + '"></td>'; } return h; };
  const todayOff = daysBetween(C.start, today);
  const todayLine = (todayOff >= 0 && todayOff < C.days) ? '<div class="today" style="left:' + (todayOff * C.px + C.px / 2) + 'px"></div>' : '';

  const rows = project.activities.map(a => {
    let bar = '';
    if(a.start && a.end){
      const off = daysBetween(C.start, a.start), len = Math.max(1, daysBetween(a.start, a.end) + 1);
      const pct = clampPct(a.pct);
      const behind = pct < activityPlannedPct(a) - 5;
      const cls = pct >= 100 ? 'done' : behind ? 'late' : '';
      const w = Math.max(10, len * C.px);
      bar = '<div class="gbar ' + cls + '" style="left:' + (off * C.px) + 'px;width:' + w + 'px" title="' + esc(a.name) + ' — ' + fmtDMY(a.start) + ' to ' + fmtDMY(a.end) + ', ' + fmt(pct, 0) + '% done">' +
        '<i style="width:' + pct + '%"></i>' + (w >= 34 ? '<span>' + fmt(pct, 0) + '%</span>' : '') + '</div>';
    }
    return '<tr><th class="nm">' + esc(a.name || 'Activity') + '</th><td class="cell" colspan="' + C.days + '" style="position:relative;padding:0">' +
      '<div style="position:relative;height:30px;width:' + C.width + 'px">' + gridStripes(C) + bar + '</div></td></tr>';
  }).join('');

  const msRows = project.milestones.filter(m => m.date).map(m => {
    const off = daysBetween(C.start, m.date);
    const dot = (off >= 0 && off < C.days) ? '<div class="ms ' + (m.done ? 'done' : '') + '" style="left:' + (off * C.px + C.px / 2 - 7) + 'px" title="' + esc(m.name) + ' — ' + fmtDMY(m.date) + '"></div>' : '';
    return '<tr class="msrow"><th class="nm">◆ ' + esc(m.name || 'Milestone') + '</th><td colspan="' + C.days + '" style="position:relative;padding:0">' +
      '<div style="position:relative;height:30px;width:' + C.width + 'px">' + gridStripes(C) + dot + '</div></td></tr>';
  }).join('');

  return '<div class="gantt"><div style="position:relative">' + todayLineWrap(todayLine) +
    '<table style="width:' + (C.width + 230) + 'px"><thead><tr><th class="nm">Activity</th>' + months + '</tr><tr><th class="nm"></th>' + ticks + '</tr></thead>' +
    '<tbody>' + rows + msRows + '</tbody></table></div></div>';
}
function gridStripes(C){
  let h = '';
  for(let k = 0; k < C.days; k++){
    const dd = dParse(addDays(C.start, k)).getDay();
    if(dd === 0 || dd === 6) h += '<span style="position:absolute;top:0;bottom:0;left:' + (k * C.px) + 'px;width:' + C.px + 'px;background:#f2f4f9"></span>';
  }
  return h;
}
function todayLineWrap(line){ return line ? '<div style="position:absolute;left:230px;top:0;bottom:0;pointer-events:none;z-index:5">' + line + '</div>' : ''; }

/* =====================================================================
   Supabase sync (shared projects) + the buying list across all projects
   ===================================================================== */
const cloud = { busy:false, projects:null, err:'' };
const cloudOn = () => !!(settings.cloud && settings.cloud.enabled && settings.cloud.url && settings.cloud.key);
function cloudBase(){
  let u = String((settings.cloud && settings.cloud.url) || '').trim().replace(/\/+$/, '');
  if(u && !/^https?:\/\//i.test(u)) u = 'https://' + u;
  if(u && !/\./.test(u.replace(/^https?:\/\//i, ''))) u = 'https://' + u.replace(/^https?:\/\//i, '') + '.supabase.co';
  return u;
}
function cloudHeaders(extra){
  const k = String((settings.cloud && settings.cloud.key) || '').trim();
  return Object.assign({ apikey:k, Authorization:'Bearer ' + k, 'Content-Type':'application/json' }, extra || {});
}
async function cloudReq(path, opts){
  opts = opts || {};
  const res = await fetch(cloudBase() + '/rest/v1/' + path, {
    method: opts.method || 'GET', headers: cloudHeaders(opts.headers),
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  if(!res.ok){
    let msg = res.status + ' ' + res.statusText;
    try{ const j = await res.json(); if(j && (j.message || j.hint)) msg = j.message || j.hint; }catch(e){}
    if(res.status === 401 || res.status === 403) msg = 'Supabase refused the request (' + res.status + '). Check the key and the table policies.';
    if(res.status === 404) msg = 'Table not found — run the setup SQL in Supabase first.';
    throw new Error(msg);
  }
  if(res.status === 204) return null;
  const txt = await res.text();
  return txt ? JSON.parse(txt) : null;
}
function cloudFail(e){
  const m = (e && e.message) ? e.message : String(e);
  cloud.err = m;
  toast(/Failed to fetch|NetworkError|Load failed/i.test(m) ? 'No connection to Supabase — check the internet and the project URL' : m);
}
/* the listing never downloads the project bodies, only their names */
async function cloudListProjects(){
  if(!cloudOn()) return null;
  cloud.err = '';
  try{
    cloud.projects = await cloudReq('pm_projects?select=id,name,client,status,updated_at&order=updated_at.desc&limit=200') || [];
    return cloud.projects;
  }catch(e){ cloudFail(e); cloud.projects = []; return null; }
}
async function cloudPushProject(p){
  if(!cloudOn()){ toast('Turn on Supabase sync in Settings first'); return false; }
  if(cloud.busy) return false;
  cloud.busy = true;
  try{
    saveNow();
    await cloudReq('pm_projects', { method:'POST', headers:{ Prefer:'resolution=merge-duplicates' },
      body:[{ id:p.id, name:projectLabel(p), client:p.client || '', status:p.status || '', updated_at:new Date().toISOString(), data:p }] });
    toast('“' + projectLabel(p) + '” saved to the cloud');
    if(cloud.projects) await cloudListProjects();
    return true;
  }catch(e){ cloudFail(e); return false; }
  finally{ cloud.busy = false; }
}
async function cloudOpenProject(id){
  if(!cloudOn()) return false;
  cloud.busy = true;
  try{
    const rows = await cloudReq('pm_projects?select=data&id=eq.' + encodeURIComponent(id) + '&limit=1');
    const raw = rows && rows[0] && rows[0].data;
    if(!raw){ toast('That project is no longer in the cloud'); return false; }
    const local = lsGet(LS.proj(id), null);
    if(local && (local.updated || 0) > (raw.updated || 0)){
      if(!confirm('Your copy of “' + projectLabel(local) + '” on this computer is newer than the cloud copy.\n\nOpen the cloud copy anyway and replace the local one?')) return false;
    }
    if(project) saveNow();
    project = normalizeProject(raw); histInit(); saveNow();
    ui.modal = null; ui.tab = 'dashboard'; ui.subSel = project.subs.length ? project.subs[0].id : ''; render();
    toast('Opened “' + projectLabel(project) + '” from the cloud');
    return true;
  }catch(e){ cloudFail(e); return false; }
  finally{ cloud.busy = false; }
}
async function cloudDeleteProject(id){
  if(!cloudOn()) return false;
  try{
    await cloudReq('pm_projects?id=eq.' + encodeURIComponent(id), { method:'DELETE' });
    await cloudListProjects(); renderModal(); toast('Removed from the cloud (your local copy is untouched)');
    return true;
  }catch(e){ cloudFail(e); return false; }

/* Pull every cloud project onto this computer, so the buying list can see
   the whole company's jobs. This one does move real data, so it is a button. */
async function cloudPullAll(){
  if(!cloudOn()) return false;
  cloud.busy = true;
  try{
    const rows = await cloudReq('pm_projects?select=id,data&limit=200') || [];
    let added = 0, updated = 0;
    rows.forEach(r => {
      if(!r.data) return;
      const inc = normalizeProject(r.data);
      const local = lsGet(LS.proj(inc.id), null);
      if(local && (local.updated || 0) >= (inc.updated || 0)) return;
      lsSet(LS.proj(inc.id), inc);
      const idx = readIndex().filter(e => e.id !== inc.id);
      idx.unshift({ id:inc.id, name:projectLabel(inc), client:inc.client || '', status:inc.status, updated:inc.updated || Date.now() });
      lsSet(LS.index, idx);
      if(local) updated++; else added++;
    });
    if(project) { const fresh = lsGet(LS.proj(project.id), null); if(fresh && (fresh.updated || 0) > (project.updated || 0)) project = normalizeProject(fresh); }
    toast(added + ' project' + (added === 1 ? '' : 's') + ' added, ' + updated + ' refreshed');
    render();
    return true;
  }catch(e){ cloudFail(e); return false; }
  finally{ cloud.busy = false; }
}

/* =====================================================================
   Buying list — every project's outstanding materials in one schedule
   ===================================================================== */
const LIVE = { confirmed:1, running:1, snagging:1 };
function allProjects(){
  const out = [];
  readIndex().forEach(e => {
    if(project && e.id === project.id){ out.push(project); return; }
    const raw = lsGet(LS.proj(e.id), null);
    if(raw) out.push(normalizeProject(raw));
  });
  if(project && !out.some(p => p.id === project.id)) out.unshift(project);
  return out;
}
function buyingList(){
  const ps = allProjects().filter(p => ui.buyAll || LIVE[p.status]);
  const map = {};
  ps.forEach(p => p.materials.forEach(m => {
    const short = matOutstanding(m);
    if(short <= 0) return;                       /* already delivered */
    const key = String(m.code || m.desc).trim().toLowerCase();
    if(!key) return;
    if(!map[key]) map[key] = { code:m.code || '', desc:m.desc || '', unit:m.unit || '', short:0, cost:0, needBy:'', suppliers:{}, lines:[], uncosted:0 };
    const r = map[key];
    r.short = r2(r.short + short);
    r.cost = r2(r.cost + r2(short * num(m.cost)));
    if(!num(m.cost)) r.uncosted++;
    if(!r.desc && m.desc) r.desc = m.desc;
    if(m.supplier) r.suppliers[m.supplier] = 1;
    if(m.needBy && (!r.needBy || m.needBy < r.needBy)) r.needBy = m.needBy;
    r.lines.push({ project:projectLabel(p), pid:p.id, short:short, needBy:m.needBy, state:matState(m), supplier:m.supplier });
  }));
  let rows = Object.keys(map).map(k => map[k]);
  if(ui.buySupplier) rows = rows.filter(r => Object.keys(r.suppliers).indexOf(ui.buySupplier) >= 0);
  const toks = ui.buyFilter.trim().toLowerCase().split(/\s+/).filter(Boolean);
  if(toks.length) rows = rows.filter(r => { const h = (r.code + ' ' + r.desc + ' ' + Object.keys(r.suppliers).join(' ')).toLowerCase(); return toks.every(t => h.includes(t)); });
  rows.sort((a, b) => String(a.needBy || '9999-99-99').localeCompare(String(b.needBy || '9999-99-99')) || String(a.code).localeCompare(String(b.code)));
  return { rows, projects:ps.length };
}
function buyingSuppliers(){
  const s = {};
  allProjects().filter(p => ui.buyAll || LIVE[p.status]).forEach(p => p.materials.forEach(m => { if(m.supplier && matOutstanding(m) > 0) s[m.supplier] = 1; }));
  return Object.keys(s).sort();
}

      '<button class="btn" data-action="buy-csv">Export CSV</button>' +

      '<div class="tablewrap"><table class="t" style="min-width:980px"><colgroup><col style="width:30px"><col style="width:120px"><col><col style="width:60px"><col style="width:110px"><col style="width:120px"><col style="width:170px"><col style="width:130px"></colgroup>' +
      '<thead><tr><th></th><th>Code</th><th>Description</th><th>Unit</th><th class="r">To buy</th><th class="r">Cost</th><th>Supplier</th><th>Needed by</th></tr></thead><tbody>' + rows + '</tbody>' +
      '<tfoot><tr><td colspan="5" class="r">Total to buy</td><td class="r">' + fmt(total) + '</td><td colspan="2"></td></tr></tfoot></table></div>' +

function buyRow(r){
  const key = (r.code || r.desc).toLowerCase();
  const open = ui.buyOpen[key];
  const late = r.needBy && r.needBy < todayISO();
  const soon = r.needBy && !late && daysBetween(todayISO(), r.needBy) <= 7;
  const sup = Object.keys(r.suppliers);
  const main = '<tr class="' + (late ? 'late' : soon ? 'soon' : '') + '">' +
    '<td class="idx"><button class="ib" data-action="buy-open" data-k="' + esc(key) + '" title="Show the projects">' + (open ? '\u2212' : '+') + '</button></td>' +
    '<td><b>' + esc(r.code || '—') + '</b></td><td>' + esc(r.desc) + '</td><td>' + esc(r.unit) + '</td>' +
    '<td class="r"><b>' + fmt(r.short, 2) + '</b></td>' +
    '<td class="r">' + (r.uncosted ? '<span class="pill amber">' + r.uncosted + ' unpriced</span>' : fmt(r.cost)) + '</td>' +
    '<td>' + esc(sup.join(', ') || '—') + '</td>' +
    '<td>' + (r.needBy ? fmtDMY(r.needBy) : '—') + (late ? ' <span class="pill red">overdue</span>' : '') + '</td></tr>';
  if(!open) return main;
  const sub = r.lines.slice().sort((a, b) => String(a.needBy || '9999').localeCompare(String(b.needBy || '9999')))
    .map(l => '<tr><td></td><td colspan="3" style="padding-left:14px;color:var(--ink-2)">' + esc(l.project) + '</td>' +
      '<td class="r">' + fmt(l.short, 2) + '</td><td class="r"><span class="pill ' + pillFor(l.state) + '">' + matStateLabel(l.state) + '</span></td>' +
      '<td>' + esc(l.supplier || '—') + '</td><td>' + (l.needBy ? fmtDMY(l.needBy) : '—') + '</td></tr>').join('');
  return main + sub;
}
function buyingCsv(){
  const q = v => /[",\n]/.test(String(v)) ? '"' + String(v).replace(/"/g, '""') + '"' : String(v);
  const B = buyingList();
  const lines = ['Code,Description,Unit,To buy,Cost,Supplier,Needed by,Projects'];
  B.rows.forEach(r => lines.push([r.code, r.desc, r.unit, r.short, r.cost, Object.keys(r.suppliers).join(' / '), r.needBy,
    r.lines.map(l => l.project + ' (' + l.short + ')').join(' | ')].map(q).join(',')));
  return lines.join('\r\n');
}

/* =====================================================================
   Events, actions, startup
   ===================================================================== */
function touch(structural){ histRecord(structural); queueSave(); refreshComputed(); renderTopbar(); }
const findSub = id => project.subs.find(s => s.id === id);
function subChild(list, subId, childId){ const s = findSub(subId); return s ? (s[list] || []).find(x => x.id === childId) : null; }

function resolveTarget(d){
  switch(d.s){
    case 'proj': return project;
    case 'mat':  return project.materials.find(x => x.id === d.i);
    case 'act':  return project.activities.find(x => x.id === d.i);
    case 'ms':   return project.milestones.find(x => x.id === d.i);
    case 'term': return project.terms.find(x => x.id === d.i);
    case 'sub':  return findSub(d.i);
    case 'var':  return subChild('variations', d.i, d.j);
    case 'cert': return subChild('certs', d.i, d.j);
    case 'pay':  return subChild('payments', d.i, d.j);
    case 'iss':  return subChild('issues', d.i, d.j);
  }
  return null;
}
function applyField(el){
  const d = el.dataset;
  if(!d.s) return;
  if(d.s === 'modal'){ if(ui.modal) ui.modal[d.f] = (el.type === 'checkbox') ? el.checked : (d.num ? num(el.value) : el.value); return; }
  let v;
  if(el.type === 'checkbox') v = el.checked;
  else if(d.num) v = num(el.value);
  else v = el.value;
  if(d.s === 'set'){ setPath(settings, d.f, v); saveSettings(); return; }
  const t = resolveTarget(d);
  if(!t) return;
  /* a blank "fixed amount" on a payment stage means: work it out from the % */
  if(d.s === 'term' && d.f === 'amount'){ t.amount = String(el.value).trim() === '' ? null : num(el.value); touch(); return; }
  if(d.f === 'pct') v = clampPct(v);
  t[d.f] = v;
  touch(el.tagName === 'SELECT' || el.type === 'checkbox');
}
function moveIn(arr, id, dir){
  const i = arr.findIndex(x => x.id === id), j = i + dir;
  if(i < 0 || j < 0 || j >= arr.length) return;
  const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
}

/* ---------- import / export ---------- */
function importQuote(){
  pickFile('.json,application/json', text => {
    let o;
    try{ o = JSON.parse(text); }catch(e){ toast('That file is not readable JSON'); return; }
    if(looksLikeQuoteStudio(o)){
      const p = projectFromQuoteStudio(o);
      if(project && project.materials.length === 0 && project.subs.length === 0 && !project.name && confirmReplaceBlank()){ /* fall through */ }
      if(project) saveNow();
      project = p; histInit(); saveNow();
      ui.tab = 'procure'; ui.modal = null; render();
      toast('Imported ' + p.materials.length + ' material lines from the quote');
      return;
    }
    if(o && Array.isArray(o.materials) && o.terms){ openTrackerFile(o); return; }
    toast('That is neither a Quote Studio quote nor a tracker file');
  });
}
const confirmReplaceBlank = () => true;
function openTrackerFile(o){
  const p = normalizeProject(o);
  if(readIndex().some(e => e.id === p.id)) p.id = uuid();
  if(project) saveNow();
  project = p; histInit(); saveNow(); ui.modal = null; render();
  toast('Opened “' + projectLabel(p) + '”');
}
function importTracker(){
  pickFile('.json,application/json', text => {
    let o;
    try{ o = JSON.parse(text); }catch(e){ toast('That file is not readable JSON'); return; }
    if(o && Array.isArray(o.materials)) openTrackerFile(o);
    else if(looksLikeQuoteStudio(o)) toast('That is a quote — use “Import a confirmed quote” instead');
    else toast('That file is not a tracker project');
  });
}
/* pull materials from a quote into the project that is already open */
function importMaterialsInto(){
  pickFile('.json,application/json', text => {
    let o;
    try{ o = JSON.parse(text); }catch(e){ toast('That file is not readable JSON'); return; }
    if(!looksLikeQuoteStudio(o)){ toast('That is not a Quote Studio quote'); return; }
    const src = projectFromQuoteStudio(o);
    let added = 0, merged = 0;
    src.materials.forEach(m => {
      const key = (m.code || m.desc).toLowerCase();
      const ex = project.materials.find(x => (x.code || x.desc).toLowerCase() === key);
      if(ex){ ex.qtyReq = r2(num(ex.qtyReq) + num(m.qtyReq)); merged++; }
      else { project.materials.push(m); added++; }
    });
    if(!num(project.contractValue) && src.contractValue) project.contractValue = src.contractValue;
    touch(true); render();
    toast(added + ' lines added' + (merged ? ', ' + merged + ' quantities topped up' : ''));
  });
}
function exportProject(){
  saveNow();
  downloadBlob(new Blob([JSON.stringify(project, null, 2)], { type:'application/json' }), safeName(projectLabel(project)) + '_tracker.json');
}
function materialsCsv(){
  const q = v => /[",\n]/.test(String(v)) ? '"' + String(v).replace(/"/g, '""') + '"' : String(v);
  const lines = ['Code,Description,Unit,Required,Ordered,Delivered,Short,Quoted rate,Quoted value,Buy price,Cost,Supplier,Needed on site,Status'];
  project.materials.forEach(m => lines.push([m.code, m.desc, m.unit, num(m.qtyReq), num(m.qtyOrdered), num(m.qtyDelivered), matOutstanding(m), num(m.rate), matValue(m), num(m.cost), matCost(m), m.supplier, m.needBy, matStateLabel(matState(m))].map(q).join(',')));
  return lines.join('\r\n');
}

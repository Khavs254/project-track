/* ---------- actions ---------- */
function act(a, el, ev){
  const d = el.dataset;
  switch(a){
    case 'tab': ui.tab = d.tab; render(); window.scrollTo(0, 0); break;
    case 'undo': undo(); break;
    case 'redo': redo(); break;
    case 'settings': ui.modal = { type:'settings' }; ui.showSql = false; renderModal(); break;
    case 'projects': ui.modal = { type:'projects' }; renderModal(); if(cloudOn()) cloudListProjects().then(() => { if(ui.modal && ui.modal.type === 'projects') renderModal(); }); break;
    case 'modal-close': { const t = ui.modal && ui.modal.type; ui.modal = null; if(t === 'settings') render(); else renderModal(); break; }
    case 'modal-bg': if(ev.target === el){ const t = ui.modal && ui.modal.type; ui.modal = null; if(t === 'settings') render(); else renderModal(); } break;
    case 'report': enterReport(); break;
    case 'report-exit': exitReport(); break;
    case 'print': renderReport(); window.print(); break;
    case 'export-json': exportProject(); break;
    case 'import-json': importTracker(); break;
    case 'import-quote': importQuote(); break;
    case 'new-project': ui.modal = { type:'newproj', name:'', client:'', location:'', contractValue:0, startDate:todayISO(), seed:true }; renderModal(); break;
    case 'newproj-ok': {
      const m = ui.modal;
      const p = blankProject(String(m.name || '').trim());
      p.client = m.client || ''; p.location = m.location || ''; p.contractValue = num(m.contractValue);
      p.startDate = m.startDate || todayISO();
      if(m.seed){ seedProgramme(p); seedTerms(p); } else p.endDate = addDays(p.startDate, 45);
      startProject(p); toast('Project created'); break;
    }
    case 'proj-open': if(loadProjectById(d.id)){ ui.modal = null; ui.tab = 'dashboard'; ui.subSel = ''; render(); } break;
    case 'proj-del': {
      if(!confirm('Delete this project from this computer? Export it first if you may need it again.')) break;
      const wasCurrent = d.id === project.id;
      deleteProjectById(d.id);
      if(wasCurrent){
        clearTimeout(saveTimer); saveTimer = null; project = null;
        const next = readIndex()[0];
        if(next && loadProjectById(next.id)){ ui.tab = 'dashboard'; }
        else { project = blankProject('New project'); seedProgramme(project); seedTerms(project); histInit(); saveNow(); }
        ui.subSel = ''; render();
      } else renderModal();
      break;
    }

    /* cloud */
    case 'cloud-test': cloudTest(); break;
    case 'cloud-sql': ui.showSql = !ui.showSql; renderModal(); break;
    case 'cloud-list': cloudListProjects().then(renderModal); break;
    case 'cloud-push': cloudPushProject(project).then(renderModal); break;
    case 'cloud-open': cloudOpenProject(d.id); break;
    case 'cloud-pull': cloudPullAll(); break;
    case 'cloud-del': if(confirm('Remove this project from the shared cloud list? Local copies stay.')) cloudDeleteProject(d.id); break;

    /* buying list */
    case 'buy-open': { const k = d.k; ui.buyOpen[k] = !ui.buyOpen[k]; render(); break; }
    case 'buy-all': ui.buyAll = !ui.buyAll; render(); break;
    case 'buy-csv': downloadBlob(new Blob([buyingCsv()], { type:'text/csv' }), 'buying_list_' + todayISO() + '.csv'); break;

    /* materials */
    case 'mat-add': { const m = newMaterial(); project.materials.push(m); touch(true); ui.focus = { sel:'[data-i="' + m.id + '"][data-f="code"]' }; render(); break; }
    case 'mat-del': { project.materials = project.materials.filter(x => x.id !== d.i); touch(true); render(); break; }
    case 'mat-done': { const m = project.materials.find(x => x.id === d.i); if(m){ m.qtyOrdered = num(m.qtyReq); m.qtyDelivered = num(m.qtyReq); touch(true); render(); } break; }
    case 'mat-import': importMaterialsInto(); break;
    case 'mat-csv': downloadBlob(new Blob([materialsCsv()], { type:'text/csv' }), safeName(projectLabel(project)) + '_materials.csv'); break;

    /* programme */
    case 'zoom': ui.ganttZoom = d.z; render(); break;
    case 'act-add': {
      const last = project.activities[project.activities.length - 1];
      const s = last ? addDays(last.end, 1) : project.startDate;
      const x = newActivity({ start:s, end:addDays(s, 4) });
      project.activities.push(x); touch(true); ui.focus = { sel:'[data-i="' + x.id + '"][data-f="name"]' }; render(); break;
    }
    case 'act-del': project.activities = project.activities.filter(x => x.id !== d.i); touch(true); render(); break;
    case 'act-move': moveIn(project.activities, d.i, parseInt(d.dir, 10)); touch(true); render(); break;
    case 'act-done': { const x = project.activities.find(y => y.id === d.i); if(x){ x.pct = 100; touch(true); render(); } break; }
    case 'act-std': {
      if(project.activities.length && !confirm('Replace the current activities with the standard roofing programme?')) break;
      seedProgramme(project); touch(true); render(); toast('Standard programme loaded'); break;
    }
    case 'act-reflow': {
      if(!project.activities.length) break;
      if(!confirm('Re-date every activity back to back, starting from ' + fmtDMY(project.startDate) + '? Durations are kept.')) break;
      let cur = project.startDate;
      project.activities.forEach(x => {
        const len = Math.max(1, (x.start && x.end) ? daysBetween(x.start, x.end) + 1 : 5);
        x.start = cur; x.end = addDays(cur, len - 1); cur = addDays(x.end, 1);
      });
      project.endDate = project.activities[project.activities.length - 1].end;
      touch(true); render(); toast('Dates re-flowed'); break;
    }
    case 'ms-add': { const m = newMilestone({ date:project.endDate }); project.milestones.push(m); touch(true); ui.focus = { sel:'[data-i="' + m.id + '"][data-f="name"]' }; render(); break; }
    case 'ms-del': project.milestones = project.milestones.filter(x => x.id !== d.i); touch(true); render(); break;

    /* payment terms */
    case 'term-add': { const t = newTerm(); project.terms.push(t); touch(true); ui.focus = { sel:'[data-i="' + t.id + '"][data-f="label"]' }; render(); break; }
    case 'term-del': project.terms = project.terms.filter(x => x.id !== d.i); touch(true); render(); break;
    case 'term-move': moveIn(project.terms, d.i, parseInt(d.dir, 10)); touch(true); render(); break;
    case 'term-std': {
      if(project.terms.length && !confirm('Replace the payment stages with 50% advance / 30% on delivery / 20% on completion?')) break;
      seedTerms(project); touch(true); render(); break;
    }

    /* subcontractors */
    case 'sub-add': { const s = newSub({ name:'' }); project.subs.push(s); ui.subSel = s.id; touch(true); ui.focus = { sel:'[data-i="' + s.id + '"][data-f="name"]', select:true }; render(); break; }
    case 'sub-pick': ui.subSel = d.i; render(); break;
    case 'sub-del': {
      const s = findSub(d.i); if(!s) break;
      if(!confirm('Remove ' + (s.name || 'this subcontractor') + ' and their whole account?')) break;
      project.subs = project.subs.filter(x => x.id !== d.i);
      ui.subSel = project.subs.length ? project.subs[0].id : '';
      touch(true); render(); break;
    }
    case 'var-add': { const s = findSub(d.i); if(s){ const v = newVariation(); s.variations.push(v); touch(true); ui.focus = { sel:'[data-j="' + v.id + '"][data-f="desc"]' }; render(); } break; }
    case 'var-del': { const s = findSub(d.i); if(s){ s.variations = s.variations.filter(x => x.id !== d.j); touch(true); render(); } break; }
    case 'cert-add': {
      const s = findSub(d.i); if(!s) break;
      const prev = s.certs.reduce((m, c) => Math.max(m, num(c.grossToDate)), 0);
      const c = newCert({ no:String(s.certs.length + 1), grossToDate:prev });
      s.certs.push(c); touch(true); ui.focus = { sel:'[data-j="' + c.id + '"][data-f="grossToDate"]', select:true }; render(); break;
    }
    case 'cert-del': { const s = findSub(d.i); if(s){ s.certs = s.certs.filter(x => x.id !== d.j); touch(true); render(); } break; }
    case 'pay-add': {
      const s = findSub(d.i); if(!s) break;
      const bal = subAccount(s).balance;
      const p = newPayment({ amount: bal > 0 ? bal : 0 });
      s.payments.push(p); touch(true); ui.focus = { sel:'[data-j="' + p.id + '"][data-f="amount"]', select:true }; render(); break;
    }
    case 'pay-del': { const s = findSub(d.i); if(s){ s.payments = s.payments.filter(x => x.id !== d.j); touch(true); render(); } break; }
    case 'iss-add': { const s = findSub(d.i); if(s){ const x = newIssue(); s.issues.push(x); touch(true); ui.focus = { sel:'[data-j="' + x.id + '"][data-f="desc"]' }; render(); } break; }
    case 'iss-del': { const s = findSub(d.i); if(s){ s.issues = s.issues.filter(x => x.id !== d.j); touch(true); render(); } break; }
  }
}

/* ---------- listeners ---------- */
document.addEventListener('click', e => { const el = e.target.closest('[data-action]'); if(el) act(el.dataset.action, el, e); });
document.addEventListener('input', e => {
  const t = e.target;
  if(t.id === 'matQ'){ ui.matFilter = t.value; render(); const f = $('#matQ'); if(f){ f.focus(); f.setSelectionRange(f.value.length, f.value.length); } return; }
  if(t.id === 'buyQ'){ ui.buyFilter = t.value; render(); const f = $('#buyQ'); if(f){ f.focus(); f.setSelectionRange(f.value.length, f.value.length); } return; }
  if(t.classList && t.classList.contains('autosize')) autosize(t);
  if(t.dataset && t.dataset.s && ((t.tagName === 'INPUT' && t.type !== 'checkbox') || t.tagName === 'TEXTAREA')) applyField(t);
});
document.addEventListener('change', e => {
  const t = e.target;
  if(t.dataset && t.dataset.onchange === 'matstatus'){ ui.matStatus = t.value; render(); return; }
  if(t.dataset && t.dataset.onchange === 'buysupplier'){ ui.buySupplier = t.value; render(); return; }
  if(!t.dataset || !t.dataset.s) return;
  if(t.tagName === 'SELECT' || (t.tagName === 'INPUT' && (t.type === 'checkbox' || t.type === 'date'))){
    applyField(t);
    if(t.dataset.rr || t.type === 'date' || t.dataset.s === 'act' || t.dataset.s === 'ms') render();
  }
});
document.addEventListener('focusout', e => {
  const t = e.target;
  if(!t || !t.dataset || !t.dataset.s) return;
  if(['mat','act','term','sub','cert','pay','iss','var'].indexOf(t.dataset.s) < 0 || t.tagName === 'SELECT') return;
  /* If focus is on its way to a button, let that button's own action redraw.
     Re-rendering here would remove the button before the click lands on it. */
  const to = e.relatedTarget;
  if(to && to.closest && to.closest('[data-action]')) return;
  /* otherwise redraw so pills, bars and the look-ahead settle once a figure is finished */
  render();
});
document.addEventListener('keydown', e => {
  const t = e.target;
  if(t && t.classList && t.classList.contains('autosize') && e.key === 'Enter'){ e.preventDefault(); return; }
  if(e.key === 'Escape'){
    if(ui.modal){ ui.modal = null; renderModal(); return; }
    if(ui.report){ exitReport(); return; }
  }
  const typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable);
  if((e.ctrlKey || e.metaKey) && !typing){
    const k = e.key.toLowerCase();
    if(k === 'z' && !e.shiftKey){ e.preventDefault(); undo(); }
    else if(k === 'y' || (k === 'z' && e.shiftKey)){ e.preventDefault(); redo(); }
  }
});
window.addEventListener('beforeprint', () => { if(!ui.report) renderReport(); });
window.addEventListener('afterprint', () => { if(!ui.report){ const r = $('#reportRoot'); if(r) r.innerHTML = ''; } });
window.addEventListener('beforeunload', () => { if(saveTimer) saveNow(); });
window.addEventListener('resize', () => { if(!ui.report) autosizeAll(); });

  let ok = false;
  const cur = lsGet(LS.cur, null);
  if(cur) ok = loadProjectById(cur);
  if(!ok){ for(const e of readIndex()){ if(loadProjectById(e.id)){ ok = true; break; } } }
  if(!ok){
    project = lsGet(LS.seeded, false) ? (function(){ const p = blankProject('New project'); seedProgramme(p); seedTerms(p); return p; })() : sampleProject();
    lsSet(LS.seeded, true); histInit(); saveNow();
  }
  ui.subSel = project.subs.length ? project.subs[0].id : '';
  render();
}
init();

</script>
</body>
</html>
